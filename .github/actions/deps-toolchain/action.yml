# Repo-specific toolchain for deps-fixer.yml (dependency program,
# AndyFooBlah/andy-private-docs#57). Used by ci.yml and deploy.yml too.
name: deps-toolchain
description: Install the toolchain CI uses
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
